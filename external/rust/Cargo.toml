[workspace]
members = [
    "crates/sayall-core",
    "crates/sayall-windows",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/GetSayAll/remote-mic-app-windows"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
